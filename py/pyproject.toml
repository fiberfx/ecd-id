[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fiberfx-eid"
version = "0.11.2"
description = "The Ecd ID (eid), version 1: parse, format, binary, leases, stream ids and brd14 ids. No minting."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Private :: Do Not Upload",
]

[tool.setuptools.packages.find]
where = ["src"]
